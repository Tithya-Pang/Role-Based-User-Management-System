services:

  registration:
    build:
      context: ./Registration_Microservice
    container_name: registration-service
    ports:
      - "5001:5001"
    env_file:
      - ./Registration_Microservice/.env
    depends_on:
      - mongodb


  login:
    build:
      context: ./Login_Microservice
    container_name: login-service
    ports:
      - "5002:5002"
    env_file:
      - ./Login_Microservice/.env
    depends_on:
      - mongodb


  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db


volumes:
  mongo-data: